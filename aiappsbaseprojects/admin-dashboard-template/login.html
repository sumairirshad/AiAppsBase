<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Pulse Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
        colors: {
          brand: {
            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
            400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
            800: '#3730a3', 900: '#312e81'
          }
        },
        boxShadow: { card: '0 1px 2px 0 rgb(0 0 0 / 0.04), 0 1px 3px 1px rgb(0 0 0 / 0.04)' }
      }
    }
  }
</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    var stored = localStorage.getItem('pulse-theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (stored ? stored === 'dark' : prefersDark) document.documentElement.classList.add('dark');
  })();
</script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100 antialiased transition-colors duration-200 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

<div class="absolute -top-32 -left-32 w-96 h-96 bg-brand-200 dark:bg-brand-900/30 rounded-full blur-3xl opacity-50"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-200 dark:bg-indigo-900/20 rounded-full blur-3xl opacity-50"></div>

<button id="themeToggle" class="absolute top-5 right-5 p-2.5 rounded-lg bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors z-10">
  <i data-lucide="sun" id="iconSun" class="w-4.5 h-4.5" style="width:18px;height:18px"></i>
  <i data-lucide="moon" id="iconMoon" class="w-4.5 h-4.5 hidden" style="width:18px;height:18px"></i>
</button>

<div class="w-full max-w-sm relative z-10">
  <div class="flex items-center justify-center gap-2.5 mb-8">
    <div class="w-9 h-9 rounded-lg bg-brand-600 flex items-center justify-center shadow-sm">
      <i data-lucide="activity" class="text-white" style="width:19px;height:19px"></i>
    </div>
    <span class="font-bold text-xl tracking-tight">Pulse</span>
  </div>

  <div class="card space-y-5">
    <div>
      <h1 class="text-xl font-bold tracking-tight">Welcome back</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Sign in to your dashboard to continue.</p>
    </div>

    <div class="space-y-2">
      <button class="w-full flex items-center justify-center gap-2.5 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg py-2.5 text-sm font-medium transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.84-.07-1.64-.21-2.42H12v4.59h6.46c-.28 1.5-1.13 2.78-2.4 3.63v3.02h3.88c2.27-2.09 3.58-5.17 3.58-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.88-3.02c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.26v3.11C3.24 21.3 7.28 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.26c-.25-.72-.38-1.49-.38-2.26s.14-1.54.38-2.26V6.63H1.26A11.95 11.95 0 000 12c0 1.93.47 3.76 1.26 5.37l4.01-3.11z"/><path fill="#EA4335" d="M12 4.77c1.77 0 3.35.6 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.28 0 3.24 2.7 1.26 6.63l4.01 3.11C6.22 6.89 8.87 4.77 12 4.77z"/></svg>
        Continue with Google
      </button>
      <button class="w-full flex items-center justify-center gap-2.5 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg py-2.5 text-sm font-medium transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2.17c-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 015.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.07.78 2.15v3.19c0 .31.21.67.8.56C20.21 21.38 23.5 17.07 23.5 12c0-6.27-5.23-11.5-11.5-11.5z"/></svg>
        Continue with GitHub
      </button>
    </div>

    <div class="flex items-center gap-3">
      <div class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></div>
      <span class="text-xs text-slate-400 dark:text-slate-500">or</span>
      <div class="h-px flex-1 bg-slate-200 dark:bg-slate-800"></div>
    </div>

    <form class="space-y-4">
      <div>
        <label class="field-label">Email address</label>
        <input type="email" placeholder="you@company.com" class="field-input">
      </div>
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="field-label !mb-0">Password</label>
          <a href="#" class="text-xs font-medium text-brand-600 dark:text-brand-400 hover:underline">Forgot?</a>
        </div>
        <input type="password" placeholder="Enter your password" class="field-input">
      </div>
      <button type="button" onclick="window.location.href='index.html'" class="w-full bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors">Sign in</button>
    </form>

    <p class="text-center text-sm text-slate-500 dark:text-slate-400">
      Don't have an account? <a href="signup.html" class="font-medium text-brand-600 dark:text-brand-400 hover:underline">Sign up</a>
    </p>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
