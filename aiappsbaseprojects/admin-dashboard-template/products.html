<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Products — Pulse Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
        colors: {
          brand: {
            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
            400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
            800: '#3730a3', 900: '#312e81'
          }
        },
        boxShadow: { card: '0 1px 2px 0 rgb(0 0 0 / 0.04), 0 1px 3px 1px rgb(0 0 0 / 0.04)' }
      }
    }
  }
</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    var stored = localStorage.getItem('pulse-theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (stored ? stored === 'dark' : prefersDark) document.documentElement.classList.add('dark');
  })();
</script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans text-slate-900 dark:text-slate-100 antialiased transition-colors duration-200">

<div id="sidebarOverlay" class="fixed inset-0 bg-black/40 z-30 hidden lg:hidden"></div>

<div class="flex min-h-screen">

  <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-64 -translate-x-full lg:translate-x-0 transition-transform duration-200 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col">
    <div class="h-16 flex items-center gap-2.5 px-5 border-b border-slate-200 dark:border-slate-800">
      <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center shadow-sm">
        <i data-lucide="activity" class="text-white" style="width:18px;height:18px"></i>
      </div>
      <span class="font-bold text-lg tracking-tight">Pulse</span>
    </div>

    <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
      <p class="px-3 text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-2">Main</p>
      <a href="index.html" class="nav-link">
        <i data-lucide="layout-dashboard" class="nav-icon"></i>
        <span>Overview</span>
      </a>
      <a href="analytics.html" class="nav-link">
        <i data-lucide="bar-chart-3" class="nav-icon"></i>
        <span>Analytics</span>
      </a>
      <a href="orders.html" class="nav-link">
        <i data-lucide="shopping-cart" class="nav-icon"></i>
        <span>Orders</span>
        <span class="ml-auto text-[11px] font-semibold bg-brand-100 text-brand-700 dark:bg-brand-900/50 dark:text-brand-300 px-1.5 py-0.5 rounded-full">12</span>
      </a>
      <a href="customers.html" class="nav-link">
        <i data-lucide="users" class="nav-icon"></i>
        <span>Customers</span>
      </a>

      <p class="px-3 text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 mb-2 mt-6">Manage</p>
      <a href="products.html" class="nav-link nav-link-active">
        <i data-lucide="package" class="nav-icon"></i>
        <span>Products</span>
      </a>
      <a href="settings.html#billing" class="nav-link">
        <i data-lucide="credit-card" class="nav-icon"></i>
        <span>Billing</span>
      </a>
      <a href="settings.html" class="nav-link">
        <i data-lucide="settings" class="nav-icon"></i>
        <span>Settings</span>
      </a>
    </nav>

    <div class="p-3 border-t border-slate-200 dark:border-slate-800">
      <a href="login.html" class="flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer transition-colors">
        <img src="https://i.pravatar.cc/80?img=12" class="w-9 h-9 rounded-full ring-2 ring-white dark:ring-slate-900" alt="User avatar">
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold truncate">Alex Rivera</p>
          <p class="text-xs text-slate-500 dark:text-slate-400 truncate">alex@pulse.app</p>
        </div>
        <i data-lucide="log-out" class="w-4 h-4 text-slate-400"></i>
      </a>
    </div>
  </aside>

  <div class="flex-1 flex flex-col min-w-0">

    <header class="h-16 flex items-center gap-4 px-4 sm:px-6 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-sm sticky top-0 z-20">
      <button id="sidebarToggle" class="lg:hidden p-2 -ml-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
      <div class="hidden sm:flex items-center flex-1 max-w-md relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 text-slate-400"></i>
        <input type="text" placeholder="Search anything..." class="w-full pl-9 pr-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-brand-400 focus:bg-white dark:focus:bg-slate-900 outline-none text-sm transition-colors" />
      </div>
      <div class="flex-1 sm:hidden"></div>
      <div class="flex items-center gap-2 sm:gap-3">
        <button id="themeToggle" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <i data-lucide="sun" id="iconSun" class="w-4.5 h-4.5" style="width:18px;height:18px"></i>
          <i data-lucide="moon" id="iconMoon" class="w-4.5 h-4.5 hidden" style="width:18px;height:18px"></i>
        </button>
        <button class="relative p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <i data-lucide="bell" class="w-4.5 h-4.5" style="width:18px;height:18px"></i>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full ring-2 ring-white dark:ring-slate-900"></span>
        </button>
      </div>
    </header>

    <main class="flex-1 p-4 sm:p-6 space-y-6 max-w-[1400px] w-full mx-auto">

      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Products</h1>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Manage your catalog and inventory.</p>
        </div>
        <button class="flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-3.5 py-2 rounded-lg transition-colors shadow-sm">
          <i data-lucide="plus" class="w-4 h-4"></i>
          Add Product
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="stat-card">
          <div class="flex items-center justify-between">
            <span class="stat-label">Total Products</span>
            <div class="stat-icon bg-brand-100 dark:bg-brand-900/40 text-brand-600 dark:text-brand-300"><i data-lucide="package" class="w-4 h-4"></i></div>
          </div>
          <p class="stat-value" data-count="186">0</p>
        </div>
        <div class="stat-card">
          <div class="flex items-center justify-between">
            <span class="stat-label">Low Stock</span>
            <div class="stat-icon bg-amber-100 dark:bg-amber-900/40 text-amber-600 dark:text-amber-300"><i data-lucide="triangle-alert" class="w-4 h-4"></i></div>
          </div>
          <p class="stat-value" data-count="9">0</p>
        </div>
        <div class="stat-card">
          <div class="flex items-center justify-between">
            <span class="stat-label">Out of Stock</span>
            <div class="stat-icon bg-rose-100 dark:bg-rose-900/40 text-rose-600 dark:text-rose-300"><i data-lucide="circle-x" class="w-4 h-4"></i></div>
          </div>
          <p class="stat-value" data-count="3">0</p>
        </div>
      </div>

      <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>

      <footer class="text-center text-xs text-slate-400 dark:text-slate-500 py-4">
        Pulse Admin Template — Built with Tailwind CSS, Chart.js &amp; Lucide Icons
      </footer>
    </main>
  </div>
</div>

<script src="js/script.js"></script>
<script>
  const PRODUCTS = [
    { name: 'Aerolite Backpack', category: 'Accessories', price: '$89.00', stock: 42, status: 'in', img: '1553062407-98eeb64c6a62' },
    { name: 'Nimbus Desk Lamp', category: 'Home', price: '$54.00', stock: 6, status: 'low', img: '1507473885765-e6ed057f782c' },
    { name: 'Terra Ceramic Mug', category: 'Kitchen', price: '$18.00', stock: 0, status: 'out', img: '1514228742587-6b1558fcca3d' },
    { name: 'Vale Linen Shirt', category: 'Apparel', price: '$64.00', stock: 28, status: 'in', img: '1521572163474-6864f9cf17ab' },
    { name: 'Kosa Leather Wallet', category: 'Accessories', price: '$42.00', stock: 15, status: 'in', img: '1627123424574-724758594e93' },
    { name: 'Drift Wireless Earbuds', category: 'Electronics', price: '$129.00', stock: 4, status: 'low', img: '1590658268037-6bf12165a8df' },
    { name: 'Hale Canvas Tote', category: 'Accessories', price: '$36.00', stock: 61, status: 'in', img: '1544816155-12df9643f363' },
    { name: 'Orbit Smart Watch', category: 'Electronics', price: '$199.00', stock: 0, status: 'out', img: '1523275335684-37898b6baf30' }
  ];

  const statusMap = {
    in: { label: 'In Stock', cls: 'badge-success' },
    low: { label: 'Low Stock', cls: 'badge-pending' },
    out: { label: 'Out of Stock', cls: 'badge-failed' }
  };

  document.getElementById('productGrid').innerHTML = PRODUCTS.map(p => `
    <div class="card !p-0 overflow-hidden hover:shadow-md transition-shadow cursor-pointer">
      <div class="aspect-[4/3] bg-slate-100 dark:bg-slate-800 overflow-hidden">
        <img src="https://images.unsplash.com/photo-${p.img}?auto=format&fit=crop&w=400&q=70" class="w-full h-full object-cover" loading="lazy">
      </div>
      <div class="p-4">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <p class="font-semibold truncate">${p.name}</p>
            <p class="text-xs text-slate-500 dark:text-slate-400">${p.category}</p>
          </div>
          <span class="badge ${statusMap[p.status].cls} shrink-0">${statusMap[p.status].label}</span>
        </div>
        <div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-100 dark:border-slate-800">
          <span class="font-semibold">${p.price}</span>
          <span class="text-xs text-slate-500 dark:text-slate-400">${p.stock} in stock</span>
        </div>
      </div>
    </div>
  `).join('');
  lucide.createIcons();
</script>
</body>
</html>
