<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Client Login — FORGE & CO.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-media">
    <div class="auth-media-text"><a href="index.html" class="logo" style="color:var(--white)">FORGE <span style="color:var(--orange)">& CO.</span></a></div>
    <div class="auth-media-text"><h2>Track project milestones, documents and invoices in one place.</h2></div>
  </div>
  <div class="auth-side">
    <div class="auth-box">
      <span class="hazard-tag">Client Portal</span>
      <h1>Welcome Back</h1>
      <p class="sub">Log in to view your project status.</p>
      <form id="loginForm">
        <div class="form-group"><label for="email">Email</label><input type="email" id="email" placeholder="you@example.com" required></div>
        <div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="••••••••" required></div>
        <p class="form-error" id="loginError">Incorrect credentials — try the demo login below.</p>
        <div class="form-meta"><label class="checkbox-row"><input type="checkbox"> Remember me</label><a href="#" style="color:var(--orange);font-weight:700">Forgot password?</a></div>
        <button type="submit" class="btn btn-dark btn-block">Log In</button>
      </form>
      <div class="demo-box"><strong>Demo Login</strong>Email: <code>demo@forgeandco.com</code><br>Password: <code>Build2025</code></div>
      <p class="auth-switch">New client? <a href="signup.html">Create an account</a></p>
    </div>
  </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
