<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — PULSE Summit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-media">
    <div class="auth-media-text"><a href="index.html" class="logo"><span class="dot"></span>PULSE</a></div>
    <div class="auth-media-text">
      <h2>6,000 builders. One stage. Your badge is waiting.</h2>
    </div>
  </div>
  <div class="auth-side">
    <div class="auth-box">
      <h1>Attendee Log In</h1>
      <p class="sub">Access your badge, agenda and connections.</p>
      <form id="loginForm">
        <div class="form-group"><label for="email">Email</label><input type="email" id="email" placeholder="you@example.com" required></div>
        <div class="form-group"><label for="password">Password</label><input type="password" id="password" placeholder="••••••••" required></div>
        <p class="form-error" id="loginError">Incorrect credentials — try the demo login below.</p>
        <div class="form-meta"><label class="checkbox-row"><input type="checkbox"> Remember me</label><a href="#" style="color:var(--coral);font-weight:700">Forgot password?</a></div>
        <button type="submit" class="btn btn-coral btn-block">Log In</button>
      </form>
      <div class="demo-box"><strong>Demo Login</strong>Email: <code>demo@pulsesummit.io</code><br>Password: <code>Pulse2025</code></div>
      <p class="auth-switch">Don't have a ticket yet? <a href="signup.html">Register now</a></p>
    </div>
  </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
