<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — Aurelia Resorts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-media">
    <div class="auth-media-text">
      <a href="index.html" class="logo">AU<em>RE</em>LIA</a>
      <div>
        <h2>Member rates, early access to suites, and curated offers.</h2>
      </div>
    </div>
  </div>
  <div class="auth-side">
    <div class="auth-box">
      <span class="kicker" style="text-align:left">Guest Portal</span>
      <h1>Create your account</h1>
      <p class="sub">Join Aurelia Privé for member-only rates.</p>
      <form id="signupForm">
        <div class="form-row-2">
          <div class="form-group"><label for="fname">First Name</label><input type="text" id="fname" placeholder="Daniel" required></div>
          <div class="form-group"><label for="lname">Last Name</label><input type="text" id="lname" placeholder="Fischer" required></div>
        </div>
        <div class="form-group"><label for="semail">Email Address</label><input type="email" id="semail" placeholder="you@example.com" required></div>
        <div class="form-group"><label for="sphone">Phone Number</label><input type="tel" id="sphone" placeholder="+1 (555) 123-4567"></div>
        <div class="form-row-2">
          <div class="form-group"><label for="spass">Password</label><input type="password" id="spass" placeholder="••••••••" required></div>
          <div class="form-group"><label for="spass2">Confirm Password</label><input type="password" id="spass2" placeholder="••••••••" required></div>
        </div>
        <div class="form-meta"><label class="checkbox-row"><input type="checkbox" required> I agree to the Terms & Privacy Policy</label></div>
        <button type="submit" class="btn btn-gold btn-block">Create Account</button>
      </form>
      <p class="auth-switch">Already a member? <a href="login.html">Sign in</a></p>
    </div>
  </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
