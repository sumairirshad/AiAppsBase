<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create Account — Ashford & Whitlock LLP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-media">
    <div class="auth-media-text"><a href="index.html" class="logo" style="color:var(--white)">Ashford <span style="color:var(--gold)">&</span> Whitlock</a></div>
    <div class="auth-media-text"><h2>Create your client account after your consultation is scheduled.</h2></div>
  </div>
  <div class="auth-side">
    <div class="auth-box">
      <span class="kicker" style="text-align:left">Client Portal</span>
      <h1>Create Your Account</h1>
      <p class="sub">For existing and new clients of the firm.</p>
      <form id="signupForm">
        <div class="form-row-2">
          <div class="form-group"><label for="fname">First Name</label><input type="text" id="fname" placeholder="Robert" required></div>
          <div class="form-group"><label for="lname">Last Name</label><input type="text" id="lname" placeholder="Lin" required></div>
        </div>
        <div class="form-group"><label for="semail">Email Address</label><input type="email" id="semail" placeholder="you@example.com" required></div>
        <div class="form-group"><label for="scase">Matter / Case Number (if known)</label><input type="text" id="scase" placeholder="AW-2025-0184"></div>
        <div class="form-row-2">
          <div class="form-group"><label for="spass">Password</label><input type="password" id="spass" placeholder="••••••••" required></div>
          <div class="form-group"><label for="spass2">Confirm Password</label><input type="password" id="spass2" placeholder="••••••••" required></div>
        </div>
        <div class="form-meta"><label class="checkbox-row"><input type="checkbox" required> I agree to the Terms & Privacy Policy</label></div>
        <button type="submit" class="btn btn-navy btn-block" style="background:var(--burgundy)">Create Account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>
</div>
<script src="js/script.js"></script>
</body>
</html>
