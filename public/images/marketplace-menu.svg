<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f2a33"/>
      <stop offset="1" stop-color="#0d3b3a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.8" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="400" height="1000" fill="url(#bg)"/>
  <rect width="400" height="1000" fill="url(#grid)"/>
  <rect width="400" height="1000" fill="url(#glow1)"/>
  <rect width="400" height="1000" fill="url(#glow2)"/>

  <!-- Browser window: dashboard -->
  <g filter="url(#shadow)" transform="translate(40 90) rotate(-4)">
    <rect width="320" height="250" rx="16" fill="#111c2e" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect width="320" height="34" rx="16" fill="#16243a"/>
    <rect y="18" width="320" height="16" fill="#16243a"/>
    <circle cx="20" cy="17" r="5" fill="#f87171"/><circle cx="37" cy="17" r="5" fill="#fbbf24"/><circle cx="54" cy="17" r="5" fill="#34d399"/>
    <rect x="80" y="10" width="180" height="14" rx="7" fill="#0b1220"/>
    <rect x="16" y="50" width="64" height="184" rx="8" fill="#0f1a2b"/>
    <rect x="26" y="64" width="44" height="8" rx="4" fill="#2dd4bf" fill-opacity="0.8"/>
    <rect x="26" y="84" width="38" height="6" rx="3" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="26" y="100" width="40" height="6" rx="3" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="26" y="116" width="34" height="6" rx="3" fill="#ffffff" fill-opacity="0.15"/>
    <rect x="92" y="50" width="100" height="56" rx="8" fill="#0f1a2b"/>
    <rect x="102" y="62" width="40" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="102" y="76" width="64" height="14" rx="4" fill="#2dd4bf"/>
    <rect x="204" y="50" width="100" height="56" rx="8" fill="#0f1a2b"/>
    <rect x="214" y="62" width="40" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="214" y="76" width="52" height="14" rx="4" fill="#38bdf8"/>
    <rect x="92" y="118" width="212" height="116" rx="8" fill="#0f1a2b"/>
    <path d="M104 214 L136 190 L164 200 L196 160 L228 172 L260 136 L292 146" fill="none" stroke="url(#hero)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M104 214 L136 190 L164 200 L196 160 L228 172 L260 136 L292 146 L292 224 L104 224 Z" fill="#14b8a6" fill-opacity="0.12"/>
  </g>

  <!-- Phone: mobile app -->
  <g filter="url(#shadow)" transform="translate(212 360) rotate(6)">
    <rect width="150" height="290" rx="26" fill="#0b1220" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="8" y="8" width="134" height="274" rx="20" fill="#111c2e"/>
    <rect x="55" y="16" width="40" height="8" rx="4" fill="#0b1220"/>
    <rect x="20" y="38" width="110" height="80" rx="12" fill="url(#warm)"/>
    <circle cx="44" cy="62" r="10" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="20" y="130" width="70" height="8" rx="4" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="20" y="146" width="96" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="20" y="168" width="50" height="50" rx="10" fill="#0f2a33"/>
    <rect x="80" y="168" width="50" height="50" rx="10" fill="#0f2a33"/>
    <rect x="32" y="182" width="26" height="22" rx="5" fill="#2dd4bf" fill-opacity="0.7"/>
    <rect x="92" y="182" width="26" height="22" rx="5" fill="#38bdf8" fill-opacity="0.7"/>
    <rect x="20" y="234" width="110" height="28" rx="14" fill="#14b8a6"/>
  </g>

  <!-- Code card -->
  <g filter="url(#shadow)" transform="translate(28 430) rotate(-3)">
    <rect width="190" height="200" rx="14" fill="#0f1a2b" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="18" cy="18" r="4" fill="#f87171"/><circle cx="32" cy="18" r="4" fill="#fbbf24"/><circle cx="46" cy="18" r="4" fill="#34d399"/>
    <rect x="18" y="40" width="36" height="7" rx="3.5" fill="#f472b6" fill-opacity="0.8"/>
    <rect x="60" y="40" width="70" height="7" rx="3.5" fill="#7dd3fc"/>
    <rect x="30" y="58" width="50" height="7" rx="3.5" fill="#2dd4bf"/>
    <rect x="86" y="58" width="60" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="30" y="76" width="90" height="7" rx="3.5" fill="#fbbf24" fill-opacity="0.85"/>
    <rect x="42" y="94" width="70" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="42" y="112" width="110" height="7" rx="3.5" fill="#7dd3fc" fill-opacity="0.8"/>
    <rect x="30" y="130" width="40" height="7" rx="3.5" fill="#2dd4bf"/>
    <rect x="18" y="148" width="20" height="7" rx="3.5" fill="#f472b6" fill-opacity="0.8"/>
    <rect x="18" y="170" width="120" height="16" rx="8" fill="#14b8a6" fill-opacity="0.2"/>
    <rect x="26" y="175" width="60" height="6" rx="3" fill="#2dd4bf"/>
  </g>

  <!-- Component tiles -->
  <g filter="url(#shadow)" transform="translate(50 690) rotate(2)">
    <rect width="300" height="180" rx="16" fill="#111c2e" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="18" y="18" width="80" height="64" rx="10" fill="url(#hero)"/>
    <rect x="110" y="18" width="80" height="64" rx="10" fill="#0f2a33"/>
    <rect x="202" y="18" width="80" height="64" rx="10" fill="url(#warm)"/>
    <rect x="126" y="34" width="48" height="8" rx="4" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="126" y="50" width="34" height="8" rx="4" fill="#ffffff" fill-opacity="0.2"/>
    <rect x="18" y="98" width="140" height="10" rx="5" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="18" y="118" width="220" height="8" rx="4" fill="#ffffff" fill-opacity="0.18"/>
    <rect x="18" y="140" width="84" height="24" rx="12" fill="#14b8a6"/>
    <rect x="112" y="140" width="84" height="24" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
  </g>

  <!-- Sparkle accents -->
  <path d="M340 60 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill="#5eead4" fill-opacity="0.9"/>
  <path d="M40 930 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#7dd3fc" fill-opacity="0.8"/>
  <path d="M372 900 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#fcd34d" fill-opacity="0.8"/>
</svg>
