<div class="tab-content">
  <div class="action-bar">
    <button mat-raised-button color="primary" *ngIf="isProcurement && (pr.prStatusCode === 'BillPending' || pr.prStatusCode === 'AwaitingBill')" (click)="uploadBill()">
      Upload bill
    </button>
    <button mat-raised-button *ngIf="isProcurement && pr.prStatusCode === 'BillPending' && canCompleteBillUpload()" (click)="completeBillUpload()">
      Complete bill upload
    </button>
    <button mat-raised-button color="accent" *ngIf="pr.prStatusCode === 'WithFinancePortal'" (click)="simulatePayment()">
      Simulate Finance Portal payment
    </button>
  </div>

  <table mat-table [dataSource]="bills" class="full-width-table" *ngIf="bills.length">
    <ng-container matColumnDef="invoiceNo"><th mat-header-cell *matHeaderCellDef>Invoice</th><td mat-cell *matCellDef="let b">{{ b.invoiceNo }}</td></ng-container>
    <ng-container matColumnDef="vendor"><th mat-header-cell *matHeaderCellDef>Vendor</th><td mat-cell *matCellDef="let b">{{ b.vendorName }}</td></ng-container>
    <ng-container matColumnDef="total"><th mat-header-cell *matHeaderCellDef>Total</th><td mat-cell *matCellDef="let b">{{ b.total | number: '1.0-2' }}</td></ng-container>
    <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Status</th><td mat-cell *matCellDef="let b"><app-status-chip [status]="b.billStatus"></app-status-chip></td></ng-container>
    <ng-container matColumnDef="paid"><th mat-header-cell *matHeaderCellDef>Paid</th><td mat-cell *matCellDef="let b">{{ b.paidAmount | number: '1.0-2' }} / {{ b.total | number: '1.0-2' }}</td></ng-container>
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let b">
        <button mat-button color="primary" *ngIf="b.billStatus === 'Uploaded' && isProcurement" (click)="forward(b)">Forward to Finance Portal</button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="['invoiceNo','vendor','total','status','paid','action']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['invoiceNo','vendor','total','status','paid','action']"></tr>
  </table>

  <p class="empty-state" *ngIf="!bills.length">No bills uploaded yet.</p>
</div>
